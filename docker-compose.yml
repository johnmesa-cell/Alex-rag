services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: alex-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - web-net
      - ia-net

  ollama:
    image: ollama/ollama:latest
    container_name: alex-ollama
    restart: unless-stopped
    profiles:
      - ia
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 7g
    cpus: 1.5
    networks:
      - ia-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: alex-qdrant
    restart: unless-stopped
    profiles:
      - ia
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ia-net

  discord-bot:
    build: ./bot-discord
    container_name: alex-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_ALLOWED_CHANNEL_IDS=${DISCORD_ALLOWED_CHANNEL_IDS}
      - N8N_DISCORD_WEBHOOK_URL=${N8N_DISCORD_WEBHOOK_URL}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - DISCORD_REQUEST_TIMEOUT_MS=${DISCORD_REQUEST_TIMEOUT_MS}
    networks:
      - web-net
      - ia-net

volumes:
  n8n_data:
  ollama_data:
  qdrant_data:
  
networks:
  web-net:
    driver: bridge
  ia-net:
    driver: bridge
    internal: true